<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#146b52">
<title>Paisa Diary</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f7f5;
  color: #18352b;
}

header {
  background: #146b52;
  color: white;
  padding: 20px;
  border-radius: 0 0 20px 20px;
}

header h2 { margin: 0 0 5px; }

main {
  padding: 16px;
  padding-bottom: 90px;
}

.card {
  background: white;
  padding: 18px;
  border-radius: 15px;
  margin-bottom: 15px;
}

.page { display: none; }
.page.active { display: block; }

label {
  display: block;
  margin: 14px 0 6px;
  font-weight: bold;
}

input, select {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccd9d2;
  border-radius: 9px;
  font-size: 16px;
  background: white;
}

button {
  cursor: pointer;
}

.primary {
  width: 100%;
  padding: 14px;
  background: #146b52;
  color: white;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
  margin-top: 18px;
}

nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: white;
  display: flex;
  justify-content: space-around;
  padding: 10px 2px;
  box-shadow: 0 -3px 12px #00000015;
}

nav button {
  border: 0;
  background: transparent;
  color: #65756d;
  font-size: 11px;
  padding: 5px 2px;
}

nav button.active {
  color: #146b52;
  font-weight: bold;
}

#message {
  margin-top: 14px;
  font-weight: bold;
  color: #146b52;
}
</style>
</head>

<body>

<header>
  <h2>💰 Paisa Diary</h2>
  <p>Apne paise ka hisaab, aasani se.</p>
</header>

<main>

<section id="home" class="page active">
  <div class="card">
    <h3>Welcome 👋</h3>
    <p>Apni income aur expenses ka hisaab rakho.</p>
    <button class="primary" onclick="showPage('add')">
      + Add Transaction
    </button>
  </div>
</section>

<section id="add" class="page">
  <div class="card">
    <h3>➕ Add Transaction</h3>

    <form id="transactionForm">

      <label>Transaction Type</label>
      <select id="type" required>
        <option value="expense">Expense (Kharcha)</option>
        <option value="income">Income (Aamdani)</option>
      </select>

      <label>Amount (₹)</label>
      <input
        id="amount"
        type="number"
        min="0.01"
        step="0.01"
        placeholder="Example: 500"
        required
      >

      <label>Category</label>
      <select id="category" required>
        <option value="Food">Food</option>
        <option value="Travel">Travel</option>
        <option value="Shopping">Shopping</option>
        <option value="Recharge">Recharge</option>
        <option value="Salary">Salary</option>
        <option value="Business">Business</option>
        <option value="Other">Other</option>
      </select>

      <label>Date</label>
      <input id="date" type="date" required>

      <label>Note (Optional)</label>
      <input
        id="note"
        type="text"
        maxlength="80"
        placeholder="Example: Lunch"
      >

      <button class="primary" type="submit">
        Save Transaction
      </button>

      <p id="message" role="status" aria-live="polite"></p>

    </form>
  </div>
</section>

<section id="history" class="page">
  <div class="card">
    <h3>📒 History</h3>
    <p>Day 3 mein transaction history banayenge.</p>
  </div>
</section>

<section id="udhaar" class="page">
  <div class="card">
    <h3>🤝 Udhaar</h3>
    <p>Udhaar tracker jald aayega.</p>
  </div>
</section>

<section id="reports" class="page">
  <div class="card">
    <h3>📊 Reports</h3>
    <p>Reports jald aayengi.</p>
  </div>
</section>

</main>

<nav>
  <button class="active" data-page="home"
    onclick="showPage('home')">🏠<br>Home</button>

  <button data-page="add"
    onclick="showPage('add')">➕<br>Add</button>

  <button data-page="history"
    onclick="showPage('history')">📒<br>History</button>

  <button data-page="udhaar"
    onclick="showPage('udhaar')">🤝<br>Udhaar</button>

  <button data-page="reports"
    onclick="showPage('reports')">📊<br>Reports</button>
</nav>

<script>
function showPage(pageId) {
  document.querySelectorAll('.page').forEach(page => {
    page.classList.remove('active');
  });

  document.getElementById(pageId).classList.add('active');

  document.querySelectorAll('nav button').forEach(button => {
    button.classList.remove('active');
  });

  const activeButton =
    document.querySelector('[data-page="' + pageId + '"]');

  if (activeButton) activeButton.classList.add('active');
}

// Aaj ki local date
function getLocalDate() {
  const now = new Date();
  now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
  return now.toISOString().slice(0, 10);
}

const dateInput = document.getElementById('date');
dateInput.value = getLocalDate();

// Transaction save
document.getElementById('transactionForm')
.addEventListener('submit', function(event) {

  event.preventDefault();

  const amount = Number(
    document.getElementById('amount').value
  );

  const message = document.getElementById('message');

  if (!Number.isFinite(amount) || amount <= 0) {
    message.textContent = 'Sahi amount enter karo.';
    return;
  }

  let transactions = [];

  try {
    const saved = localStorage.getItem(
      'paisaDiaryTransactions'
    );

    transactions = saved ? JSON.parse(saved) : [];

    if (!Array.isArray(transactions)) {
      throw new Error('Invalid data');
    }
  } catch (error) {
    message.textContent = 'Saved data read nahi ho pa raha.';
    return;
  }

  const transaction = {
    id: Date.now().toString(),
    type: document.getElementById('type').value,
    amount: amount,
    category: document.getElementById('category').value,
    date: document.getElementById('date').value,
    note: document.getElementById('note').value.trim()
  };

  if (!transaction.date) {
    message.textContent = 'Date select karo.';
    return;
  }

  transactions.push(transaction);

  try {
    localStorage.setItem(
      'paisaDiaryTransactions',
      JSON.stringify(transactions)
    );

    message.textContent =
      '✅ Saved! Total entries: ' + transactions.length;

    this.reset();
    dateInput.value = getLocalDate();

  } catch (error) {
    message.textContent =
      'Save nahi hua. Phone storage check karo.';
  }
});
</script>

</body>
</html>
